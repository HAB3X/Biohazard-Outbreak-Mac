<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outbreak Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='5' width='22' height='22' rx='6' fill='%237aa2ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/studio.css">
</head>
<body>
<div id="loading"><div class="box"><div style="font-size:16px;color:var(--text);font-weight:600">Outbreak Studio</div><div id="loadmsg" style="margin-top:6px">Reading the scenario…</div><div class="bar"><i></i></div></div></div>
<div id="app">
  <header id="topbar"></header>
  <aside id="side"></aside>
  <main id="view">
    <canvas id="gl"></canvas>
    <img id="shot" alt="">
    <canvas id="ov"></canvas>
    <div class="float" id="loadchip"></div>
    <div class="float menu" id="viewmenu"></div>
    <div class="float" id="coords"></div>
    <div class="float" id="banner"></div>
    <div class="float" id="toolbar"></div>
  </main>
  <aside id="inspector"></aside>
</div>
<div id="toasts"></div>
<div id="palette"><div class="box"><input id="pal-input" placeholder="Type what you want to do…" autocomplete="off"><ul id="pal-list"></ul></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
