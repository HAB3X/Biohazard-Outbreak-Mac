<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outbreak Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236aa5ff'/%3E%3Cstop offset='1' stop-color='%23a98bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/studio.css">
</head>
<body>
<div id="loading"><div class="box"><div style="font-size:18px;color:var(--text);font-weight:650">Outbreak Studio</div><div id="loadmsg">Reading the scenario…</div><div class="bar"><i></i></div></div></div>
<div id="app">
  <header id="topbar"></header>
  <nav id="rail"></nav>
  <aside id="outline"></aside>
  <main id="view">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div id="roombar"></div>
    <div class="hud tl" id="hud-tl"></div>
    <div class="hud tr" id="hud-tr"></div>
    <div class="hud bl" id="hud-bl"></div>
    <div class="hud br" id="hud-br"></div>
  </main>
  <aside id="inspector"></aside>
  <footer id="status"></footer>
</div>
<div id="toasts"></div>
<div id="palette"><div class="box"><input id="pal-input" placeholder="Type a command or a room…" autocomplete="off"><ul id="pal-list"></ul></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
