# DNAS (Sony's network authentication) decrypts blocks of its code before running them, each library with its own routine
# (the call's arguments kept beside the block): the recompiler runs those routines on the overlay ahead of time and
# recompiles the plain code. Words left that don't decode (the blocks' keys, junk between them) stop the game if reached
[[overlays]]
name = "netdnas"
file = "BIN/4.DAT"
base = "0x6af000"
text = ["0x6af040", "0x71ff00"]
decrypt = ["0x6db1a0", "0x714f00"]

