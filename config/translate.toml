# Where the games' text is (docs/translation.md has the evidence). Offsets are in the executable file unless said otherwise.
[file2]
executable = "SLPM_656.92"
# The executable's pool of Shift-JIS strings reached through pointer tables: file offsets (first, last+1), and the address
# of a file offset's byte (its only segment: address = offset + base)
pool = [0x13E060, 0x143110]
base = 0xFFE00
# Message files in the stage archives (the NETBIO00.DAT members r0NN.afs): rNNN.bin (the rooms' messages), dmNNN.bin (the
# demos' subtitles), spmNNNNNN.bin (the characters' speech)
message_archives = "/NETBIO00.DAT/r0*.afs"
message_files = '^(r\d{3}|dm\d{3}|spm\d{6})\.bin$'
# The text fonts (tools/bh_font.py): their button glyphs drawn as the keyboard's keys for the keyboard and mouse
fonts = ["romdata.afs/d20go04.bin", "romdata.afs/d20le04.bin"]
# The programs' other strings, as File 1's overlay_pools (see there; "elf" is the executable). Regions found by listing the
# strings of each data section and keeping the runs of text; left out on purpose: the network overlay's kana tables (the name
# entry's keyboard, its romaji to kana table), its font table at 0xA4F00 and a test name at 0xB9FC0
overlay_pools = [
    { file = "elf", region = [0x143700, 0x1437C0], in_place = true },        # the DUALSHOCK 2 warning
    { file = "elf", region = [0x14A9F8, 0x14AA49], in_place = true },        # the network browser's buttons
    { file = "BIN/1.DAT", region = [0x289E0, 0x28AB8], in_place = true },    # collection: dialogs, hints
    { file = "BIN/1.DAT", region = [0x28AC8, 0x28C00], in_place = true },    # collection: hints, movie names
    { file = "BIN/1.DAT", region = [0x291B0, 0x292E0], in_place = true },    # collection: the stage list
    { file = "BIN/1.DAT", region = [0x29710, 0x29A10], in_place = true },    # collection: records
    { file = "BIN/2.DAT", region = [0x212058, 0x212068], in_place = true },  # game: clock
    { file = "BIN/2.DAT", region = [0x212220, 0x212250], in_place = true },  # game: "used %s"
