inverted = [{ file = "SLPM_656.92", region = [0x143110, 0x143700] }]
# The network browser's pages (*.HTM)
html = "/NETBIO00.DAT/rfff.afs"

[file1]
executable = "SLPM_654.28"
# The same kind of pool as File 2's, from the game's title (0x132440) to the end of the handle-name word filter (0x134C88);
# found by File 2's pool strings occurring in it (208 of them, all inside this range)
pool = [0x132440, 0x134C88]
base = 0xFFE00
message_files = '^(r\d{3}|dm\d{3}|spm\d{6})\.bin$'
# The same Japanese line in both games is one unit: File 2's English is used for it unless File 1's translations have it
fallback = "file2"
# The item and message files (tools/bh_itemmsg.py)
item_msg = true
fonts = ["romdata.afs/d20go04.bin", "romdata.afs/s20le04.bin"]
# The overlays' own pools (file offsets in the overlay; each region runs from its first string to the next data that isn't
# a string, found by listing the strings of the overlay's data). Many of their strings are reached by code, not pointers:
# those are translated in place
overlay_pools = [
    { file = "PROG/DEMO.BIN", region = [0x20158, 0x23E08], in_place = true },     # title menus, options, records, gallery
    { file = "PROG/GAME.BIN", region = [0x1CA920, 0x1CAC40], in_place = true },   # results, save
    { file = "PROG/GAME.BIN", region = [0x1CD910, 0x1CD970], in_place = true },   # pause menu
    { file = "PROG/GAME.BIN", region = [0x1CDBB8, 0x1CE000], in_place = true },   # item use, quit dialogs
    { file = "PROG/SINGLE.BIN", region = [0x1B6D0, 0x1B780], in_place = true },   # results
    { file = "PROG/NETAQ.BIN", region = [0x4BE0, 0x5340], in_place = true },      # the network game's event log
    { file = "PROG/NETWK.BIN", region = [0x9F2D0, 0x9F44C], in_place = true },    # network: chat phrase labels
    { file = "PROG/NETWK.BIN", region = [0xA1A80, 0xA2FA0], in_place = true },    # network: error pages and dialogs
    { file = "PROG/NETWK.BIN", region = [0xAD638, 0xAD6F0], in_place = true },    # network: server list
    { file = "PROG/NETWK.BIN", region = [0xAD960, 0xB2D80], in_place = true },    # network: lobby messages, menus
    { file = "PROG/NETWK.BIN", region = [0xB4118, 0xB4150], in_place = true },
