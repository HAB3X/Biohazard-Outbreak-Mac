# Biohazard Outbreak (Japan, SLPM-65428, disc version 1.04): the recompiler's settings
[executable]
sha1 = "0211217647e5ad47aec97073feb8b8f9265d361b"
# The executable has no section table. Its code runs from the start of its first segment to the VU microcode (DMA packets of
# VIF MPG codes, 0x1D9B00-0x1E9E80), then data (libcdvd's and libkernel's: "PsIIlibcdvd 2800" at 0x1E9E80); code again from
# 0x1EC388 (libkernel's, to 0x1ED8A8: its kernel mode routines are the last; the words from 0x1ED8D0 on are their tables, then
# the data). The same layout as File 2's.
text = [["0x100000", "0x1d9b00"], ["0x1ec388", "0x1ed8d0"]]
vutext = ["0x1d9b00", "0x1e9e80"]

