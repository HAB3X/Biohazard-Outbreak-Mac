    { box = [80, 213, 96, 221], key = "leftright" },
    { box = [98, 208, 108, 224], key = "updown" },
    { box = [114, 210, 128, 224], key = "triangle" },
    { box = [82, 226, 96, 240], key = "square", mode = "play" },
    { box = [98, 226, 112, 240], key = "circle", mode = "play" },
    { box = [114, 226, 128, 240], key = "cross" },
]

