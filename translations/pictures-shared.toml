[[picture]]
file = "romdata.afs/cockpit.tex"
tim = 0
note = "the status screen's button glyphs; square and circle are the pause menu's legend of the controls in play (Ad-lib, Confirm/Attack): play's keys. Cross is also the map's CANCEL: the menus' key (the legend names play's dash with the font's play glyph)"
